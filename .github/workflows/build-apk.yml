name: Build Ashpazbashi APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          flutter create --project-name ashpazbashi --platforms=android .
          mkdir -p lib assets/images test

      - name: Write pubspec
        run: |
          cat > pubspec.yaml <<'EOF'
          name: ashpazbashi
          description: Persian smart cooking app test build
          publish_to: 'none'
          version: 0.3.0+5
          environment:
            sdk: '>=3.3.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            shared_preferences: ^2.5.3
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_launcher_icons: ^0.14.4
          flutter:
            uses-material-design: true
            assets:
              - assets/images/logo.png
              - assets/images/app_icon.png
          flutter_launcher_icons:
            android: true
            image_path: assets/images/app_icon.png
            min_sdk_android: 21
            adaptive_icon_background: "#FFF8ED"
            adaptive_icon_foreground: assets/images/app_icon.png
          EOF

      - name: Write app source
        run: |
          cat > lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';
          import 'package:flutter_localizations/flutter_localizations.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          const saffron = Color(0xFFF5A623);
          const tomato = Color(0xFFE85D2A);
          const cinnamon = Color(0xFF6E351F);
          const cream = Color(0xFFFFF8ED);

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            final prefs = await SharedPreferences.getInstance();
            runApp(AshpazBashi(prefs: prefs));
          }

          class AshpazBashi extends StatelessWidget {
            const AshpazBashi({super.key, required this.prefs});
            final SharedPreferences prefs;

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                locale: const Locale('fa'),
                supportedLocales: const [Locale('fa')],
                localizationsDelegates: const [
                  GlobalMaterialLocalizations.delegate,
                  GlobalWidgetsLocalizations.delegate,
                  GlobalCupertinoLocalizations.delegate,
                ],
                theme: ThemeData(
                  useMaterial3: true,
                  colorScheme: ColorScheme.fromSeed(seedColor: tomato),
                  scaffoldBackgroundColor: cream,
                  filledButtonTheme: FilledButtonThemeData(
                    style: FilledButton.styleFrom(
                      backgroundColor: tomato,
                      minimumSize: const Size.fromHeight(52),
                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(18)),
                    ),
                  ),
                  inputDecorationTheme: InputDecorationTheme(
                    filled: true,
                    fillColor: Colors.white,
                    border: OutlineInputBorder(
                      borderRadius: BorderRadius.circular(18),
                      borderSide: BorderSide.none,
                    ),
                  ),
                ),
                home: Directionality(
                  textDirection: TextDirection.rtl,
                  child: Home(prefs: prefs),
                ),
              );
            }
          }

          class Home extends StatefulWidget {
            const Home({super.key, required this.prefs});
            final SharedPreferences prefs;
            @override
            State<Home> createState() => _HomeState();
          }

          class _HomeState extends State<Home> {
            int tab = 0;
            late DateTime trialStart;
            final shopping = <String>[];
            final ingredients = TextEditingController();
            final shopController = TextEditingController();

            @override
            void initState() {
              super.initState();
              final raw = widget.prefs.getString('trial_start');
              if (raw == null) {
                trialStart = DateTime.now();
                widget.prefs.setString('trial_start', trialStart.toIso8601String());
              } else {
                trialStart = DateTime.tryParse(raw) ?? DateTime.now();
              }
              shopping.addAll(widget.prefs.getStringList('shopping') ?? []);
            }

            int get daysLeft {
              final end = trialStart.add(const Duration(days: 10));
              final hours = end.difference(DateTime.now()).inHours;
              if (hours <= 0) return 0;
              return (hours / 24).ceil().clamp(0, 10).toInt();
            }

            bool get premium => widget.prefs.getBool('premium') ?? false;
            bool get access => premium || daysLeft > 0;

            @override
            void dispose() {
              ingredients.dispose();
              shopController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final pages = [
                _homePage(),
                _aiPage(),
                _shoppingPage(),
                _profilePage(),
              ];
              return Scaffold(
                appBar: AppBar(
                  title: Row(children: [
                    Image.asset('assets/images/logo.png', width: 38, height: 38),
                    const SizedBox(width: 8),
                    const Text('آشپزباشی', style: TextStyle(fontWeight: FontWeight.w900)),
                  ]),
                  actions: [
                    if (!premium)
                      Padding(
                        padding: const EdgeInsets.only(left: 8),
                        child: Chip(label: Text('$daysLeft روز آزمایشی')),
                      ),
                  ],
                ),
                body: pages[tab],
                bottomNavigationBar: NavigationBar(
                  selectedIndex: tab,
                  onDestinationSelected: (v) => setState(() => tab = v),
                  destinations: const [
                    NavigationDestination(icon: Icon(Icons.home_outlined), selectedIcon: Icon(Icons.home), label: 'خانه'),
                    NavigationDestination(icon: Icon(Icons.auto_awesome_outlined), selectedIcon: Icon(Icons.auto_awesome), label: 'آشپز هوشمند'),
                    NavigationDestination(icon: Icon(Icons.shopping_basket_outlined), selectedIcon: Icon(Icons.shopping_basket), label: 'خرید'),
                    NavigationDestination(icon: Icon(Icons.person_outline), selectedIcon: Icon(Icons.person), label: 'پروفایل'),
                  ],
                ),
              );
            }

            Widget _homePage() {
              final recipes = [
                ('🍗', 'زرشک پلو با مرغ', '۷۵ دقیقه'),
                ('🥘', 'قورمه سبزی', '۱۵۰ دقیقه'),
                ('🍳', 'املت گوجه سریع', '۱۵ دقیقه'),
                ('🥣', 'عدسی صبحانه', '۴۵ دقیقه'),
              ];
              return ListView(
                padding: const EdgeInsets.all(18),
                children: [
                  Container(
                    padding: const EdgeInsets.all(20),
                    decoration: BoxDecoration(
                      gradient: const LinearGradient(colors: [Color(0xFFFFEEE2), Color(0xFFFFF8ED)]),
                      borderRadius: BorderRadius.circular(26),
                    ),
                    child: const Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text('امروز چی بپزیم؟', style: TextStyle(fontSize: 28, fontWeight: FontWeight.w900, color: cinnamon)),
                        SizedBox(height: 8),
                        Text('دستورهای خوشمزه، لیست خرید و پیشنهاد هوشمند در یک جا.', style: TextStyle(height: 1.7)),
                      ],
                    ),
                  ),
                  const SizedBox(height: 18),
                  const Text('پیشنهادهای امروز', style: TextStyle(fontSize: 21, fontWeight: FontWeight.w900)),
                  const SizedBox(height: 10),
                  ...recipes.map((r) => Card(
                    child: ListTile(
                      contentPadding: const EdgeInsets.all(14),
                      leading: Text(r.$1, style: const TextStyle(fontSize: 38)),
                      title: Text(r.$2, style: const TextStyle(fontWeight: FontWeight.w800)),
                      subtitle: Text(r.$3),
                      trailing: const Icon(Icons.chevron_left),
                      onTap: () => _recipe(r.$2),
                    ),
                  )),
                ],
              );
            }

            void _recipe(String title) {
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                builder: (_) => Directionality(
                  textDirection: TextDirection.rtl,
                  child: Padding(
                    padding: const EdgeInsets.fromLTRB(20, 20, 20, 36),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text(title, style: const TextStyle(fontSize: 26, fontWeight: FontWeight.w900)),
                        const SizedBox(height: 12),
                        const Text('مواد لازم', style: TextStyle(fontSize: 19, fontWeight: FontWeight.w800)),
                        const Text('• پیاز\n• ادویه\n• مواد اصلی غذا\n• نمک و فلفل', style: TextStyle(height: 1.8)),
                        const SizedBox(height: 12),
                        FilledButton.icon(
                          onPressed: () async {
                            for (final i in ['پیاز', 'ادویه', 'نمک', 'فلفل']) {
                              if (!shopping.contains(i)) shopping.add(i);
                            }
                            await widget.prefs.setStringList('shopping', shopping);
                            if (mounted) {
                              Navigator.pop(context);
                              setState(() => tab = 2);
                            }
                          },
                          icon: const Icon(Icons.add_shopping_cart),
                          label: const Text('افزودن مواد به لیست خرید'),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }

            Widget _aiPage() {
              return ListView(
                padding: const EdgeInsets.all(18),
                children: [
                  const Text('✨ آشپز هوشمند', style: TextStyle(fontSize: 28, fontWeight: FontWeight.w900, color: cinnamon)),
                  const SizedBox(height: 8),
                  const Text('مواد داخل خانه را بنویس تا یک پیشنهاد سریع بگیری.'),
                  const SizedBox(height: 16),
                  TextField(
                    controller: ingredients,
                    minLines: 3,
                    maxLines: 5,
                    decoration: const InputDecoration(hintText: 'مثلاً مرغ، قارچ، برنج، گوجه...'),
                  ),
                  const SizedBox(height: 12),
                  FilledButton.icon(
                    onPressed: () {
                      if (!access) {
                        _paywall();
                        return;
                      }
                      final text = ingredients.text.trim();
                      if (text.isEmpty) return;
                      showDialog(
                        context: context,
                        builder: (_) => AlertDialog(
                          title: const Text('پیشنهاد آشپزباشی'),
                          content: Text('با «$text» می‌توانی یک خوراک تابه‌ای سریع درست کنی. مواد سفت‌تر را اول تفت بده، سپس بقیه مواد و ادویه را اضافه کن و با حرارت متوسط بپز.'),
                          actions: [TextButton(onPressed: () => Navigator.pop(context), child: const Text('باشه'))],
                        ),
                      );
                    },
                    icon: const Icon(Icons.auto_awesome),
                    label: const Text('پیشنهاد غذا'),
                  ),
                  const SizedBox(height: 20),
                  const Card(
                    child: Padding(
                      padding: EdgeInsets.all(16),
                      child: Text('نسخه نهایی می‌تواند به هوش مصنوعی سمت سرور، تشخیص مواد از عکس، فرمان صوتی و برنامه غذایی هفتگی متصل شود.', style: TextStyle(height: 1.7)),
                    ),
                  ),
                ],
              );
            }

            Widget _shoppingPage() {
              return Padding(
                padding: const EdgeInsets.all(18),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    const Text('🛒 لیست خرید', style: TextStyle(fontSize: 28, fontWeight: FontWeight.w900)),
                    const SizedBox(height: 14),
                    Row(children: [
                      Expanded(child: TextField(controller: shopController, decoration: const InputDecoration(hintText: 'مثلاً زعفران'))),
                      const SizedBox(width: 8),
                      IconButton.filled(
                        onPressed: () async {
                          final v = shopController.text.trim();
                          if (v.isEmpty) return;
                          if (!shopping.contains(v)) shopping.add(v);
                          await widget.prefs.setStringList('shopping', shopping);
                          shopController.clear();
                          setState(() {});
                        },
                        icon: const Icon(Icons.add),
                      ),
                    ]),
                    const SizedBox(height: 12),
                    Expanded(
                      child: shopping.isEmpty
                          ? const Center(child: Text('لیست خرید خالی است.'))
                          : ListView.builder(
                              itemCount: shopping.length,
                              itemBuilder: (_, i) => Dismissible(
                                key: ValueKey(shopping[i]),
                                onDismissed: (_) async {
                                  shopping.removeAt(i);
                                  await widget.prefs.setStringList('shopping', shopping);
                                  setState(() {});
                                },
                                background: Container(color: Colors.red.shade100),
                                child: ListTile(
                                  leading: const Icon(Icons.check_box_outline_blank),
                                  title: Text(shopping[i]),
                                ),
                              ),
                            ),
                    ),
                  ],
                ),
              );
            }

            Widget _profilePage() {
              return ListView(
                padding: const EdgeInsets.all(18),
                children: [
                  Center(child: Image.asset('assets/images/logo.png', width: 140, height: 140)),
                  const SizedBox(height: 10),
                  const Text('آشپزباشی', textAlign: TextAlign.center, style: TextStyle(fontSize: 28, fontWeight: FontWeight.w900)),
                  const SizedBox(height: 6),
                  Text(
                    premium ? 'نسخه کامل فعال است' : '$daysLeft روز از دوره آزمایشی باقی مانده',
                    textAlign: TextAlign.center,
                  ),
                  const SizedBox(height: 20),
                  Card(
                    child: Column(children: [
                      ListTile(leading: const Icon(Icons.timer_outlined), title: const Text('دوره آزمایشی'), trailing: Text(premium ? 'کامل' : '۱۰ روز')),
                      ListTile(leading: const Icon(Icons.shopping_basket_outlined), title: const Text('اقلام خرید'), trailing: Text('${shopping.length}')),
                    ]),
                  ),
                  const SizedBox(height: 12),
                  if (!premium)
                    FilledButton.icon(
                      onPressed: _paywall,
                      icon: const Icon(Icons.workspace_premium),
                      label: const Text('مشاهده نسخه کامل'),
                    ),
                ],
              );
            }

            void _paywall() {
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                builder: (_) => Directionality(
                  textDirection: TextDirection.rtl,
                  child: Padding(
                    padding: const EdgeInsets.fromLTRB(20, 24, 20, 40),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        const Icon(Icons.workspace_premium, size: 70, color: saffron),
                        const Text('آشپزباشی پلاس', style: TextStyle(fontSize: 28, fontWeight: FontWeight.w900)),
                        const SizedBox(height: 10),
                        const Text('پس از ۱۰ روز آزمایشی، برای ادامه امکانات هوشمند می‌توان اشتراک ماهانه یا سالانه تهیه کرد.', textAlign: TextAlign.center, style: TextStyle(height: 1.7)),
                        const SizedBox(height: 18),
                        FilledButton(
                          onPressed: () async {
                            await widget.prefs.setBool('premium', true);
                            if (mounted) {
                              Navigator.pop(context);
                              setState(() {});
                            }
                          },
                          child: const Text('فعال‌سازی نسخه کامل — دمو'),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          EOF

      - name: Write test
        run: |
          rm -f test/widget_test.dart\n          cat > test/app_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          void main() {
            test('trial is ten days', () {
              final start = DateTime(2026, 1, 1);
              expect(start.add(const Duration(days: 10)).difference(start).inDays, 10);
            });
          }
          EOF

      - name: Create Ashpazbashi launcher icon
        run: |
          python3 - <<'PY'
          import struct, zlib
          W=H=512
          bg=(255,248,237,255)
          orange=(232,93,42,255)
          brown=(110,53,31,255)
          gold=(245,166,35,255)
          white=(255,255,255,255)
          px=[list(bg) for _ in range(W*H)]
          def put(x,y,col):
              if 0<=x<W and 0<=y<H: px[y*W+x]=list(col)
          def rect(x0,y0,x1,y1,col,r=0):
              for y in range(max(0,y0),min(H,y1)):
                  for x in range(max(0,x0),min(W,x1)):
                      put(x,y,col)
          def circle(cx,cy,r,col):
              rr=r*r
              for y in range(max(0,cy-r),min(H,cy+r+1)):
                  for x in range(max(0,cx-r),min(W,cx+r+1)):
                      if (x-cx)*(x-cx)+(y-cy)*(y-cy)<=rr: put(x,y,col)
          # pot
          rect(116,260,396,382,orange)
          circle(145,320,46,orange); circle(367,320,46,orange)
          rect(142,270,370,390,brown)
          rect(126,250,386,286,gold)
          # chef hat
          circle(192,190,62,white); circle(256,158,78,white); circle(325,194,60,white)
          rect(170,190,344,255,white)
          # steam / heart-like curls
          circle(292,106,18,gold); circle(332,106,18,gold)
          rect(292,102,58,12,gold)
          # simple saffron mark on pot
          circle(256,326,18,gold)
          for d in range(-55,56):
              put(256+d,354-abs(d)//3,gold)
          raw=bytearray()
          for y in range(H):
              raw.append(0)
              for x in range(W):
                  raw.extend(px[y*W+x])
          def chunk(t,d):
              return struct.pack(">I",len(d))+t+d+struct.pack(">I",zlib.crc32(t+d)&0xffffffff)
          png=b"\x89PNG\r\n\x1a\n"+chunk(b'IHDR',struct.pack(">IIBBBBB",W,H,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(bytes(raw),9))+chunk(b'IEND',b'')
          open('assets/images/app_icon.png','wb').write(png)
          open('assets/images/logo.png','wb').write(png)
          PY

      - name: Set Persian app name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('android:label="ashpazbashi"', 'android:label="آشپزباشی"')
          p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AshpazBashi-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
